# Sentinel-SLA CI.
# Runs the full check suite (lint + typecheck + unit tests) and the
# monitoring-stack config validation on every push and pull request.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma client generate
        run: bun run db:generate

      - name: Full check (lint + typecheck + unit tests)
        run: bun run check

      # The OpenAPI document is
      # validated in CI with an OpenAPI linter (Spectral, openapi/spectral.yaml)
      # plus the official OpenAPI 3.0 JSON-Schema (scripts/lint-openapi.mjs).
      - name: OpenAPI lint (Spectral + official schema)
        run: bun run lint:spec

      # docs/API.md is GENERATED from openapi/openapi.yaml — fail on drift.
      - name: API.md up to date with the OpenAPI document
        run: bun scripts/generate-api-docs.mjs --check

      - name: Monitoring stack config validation
        run: bash tests/integration/test_stack.sh

  contract:
    # Contract tests need a live server (like the authz matrix). When secrets
    # are present they run against an ephemeral Next.js instance; otherwise
    # the script exits 77 (skip) and the job stays green.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prisma client generate
        run: bun run db:generate
      - name: Build
        run: bun run build
      - name: Start server + run API contract tests
        env:
          CONTRACT_OWNER_EMAIL: owner@contract.test
          CONTRACT_OWNER_PASSWORD: contract-owner-pass-2026
          DATABASE_URL: file:../db/contract-ci.db
          SENTINEL_MODE: demo
        run: |
          bun run db:push
          PORT=3111 NODE_ENV=production HOSTNAME=0.0.0.0 bun .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3111/api/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          # the contract script performs first-run setup itself when the DB
          # has no accounts (GET /api/auth/setup → available) and logs in
          # otherwise — works on ephemeral CI DBs and on a running dev box.
          CONTRACT_BASE_URL=http://127.0.0.1:3111 \
            bun tests/integration/api-contract.mjs
          kill $SERVER_PID
