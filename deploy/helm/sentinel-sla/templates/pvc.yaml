{{- /*
═══════════════════════════════════════════════════════════════════════════
Sentinel-SLA — PersistentVolumeClaim (guarded)
Owner: Sentinel-SLA SRE
Holds the SQLite database (database.url file:/data/sentinel.db) and the
archived PDF reports (SENTINEL_DATA_DIR=/data). Disable persistence only
for throwaway demo installs — data will be lost on pod reschedule.
═══════════════════════════════════════════════════════════════════════════
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
