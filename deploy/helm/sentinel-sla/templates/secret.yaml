{{- /*
═══════════════════════════════════════════════════════════════════════════
Sentinel-SLA — Notification/Ack Secret (guarded)
Owner: Sentinel-SLA SRE
Created only when at least one credential value is provided. If you prefer
to manage the Secret yourself (gitops/sealed-secrets), set
notify.existingSecret and leave the inline values empty — keys:
  telegramBotToken, baleBotToken, ackSecret
═══════════════════════════════════════════════════════════════════════════
*/}}
{{- $secretName := default (printf "%s-%s" .Release.Name "notify") .Values.notify.existingSecret }}
{{- if and (or .Values.notify.telegramBotToken .Values.notify.baleBotToken .Values.sentinel.ackSecret) (not .Values.notify.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  telegramBotToken: {{ .Values.notify.telegramBotToken | default "" | quote }}
  baleBotToken: {{ .Values.notify.baleBotToken | default "" | quote }}
  ackSecret: {{ .Values.sentinel.ackSecret | default "" | quote }}
{{- end }}
