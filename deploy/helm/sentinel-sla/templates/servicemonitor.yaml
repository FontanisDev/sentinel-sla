{{- /*
═══════════════════════════════════════════════════════════════════════════
Sentinel-SLA — ServiceMonitor (Prometheus Operator pattern)
Owner: Sentinel-SLA SRE
Guarded by .Values.serviceMonitor.enabled. Carries the `release` label that
kube-prometheus-stack's Prometheus selects on — the standard convention for
getting a workload scraped without hand-editing Prometheus config. Scrapes
the exporter sidecar's metrics port (business + financial metrics).
═══════════════════════════════════════════════════════════════════════════
*/}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    release: {{ .Values.serviceMonitor.release | quote }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: {{ .Values.serviceMonitor.path }}
      scrapeTimeout: 10s
{{- end }}
