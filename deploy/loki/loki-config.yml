# ═══════════════════════════════════════════════════════════════════════════
# Sentinel-SLA — Loki 3.1 single-node configuration
# Owner: Sentinel-SLA SRE
#
# Deliberately simple "small-and-sturdy" setup:
#   * auth disabled (internal docker network only — not exposed to the internet)
#   * TSDB index schema (v13, the successor of boltdb-shipper) on the local
#     filesystem — no S3/MinIO needed for the MVP tier; when the volume grows,
#     swap `filesystem` for an S3-compatible object store (Iranian providers or
#     on-prem MinIO) without touching the rest of the stack.
#   * rejects samples older than 7 days to protect against clock-skewed clients.
# ═══════════════════════════════════════════════════════════════════════════

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# In-memory results cache — good enough for single-node MVP dashboards
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb # boltdb-shipper lineage, required for Loki 3.x
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7 days
  allow_structured_metadata: false # keep 2.9-compatible ingestion semantics
  retention_period: 336h # 14 days of log history (aligned with 15d metrics retention)

# Retention is only enforced when the compactor runs with retention enabled.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false # do not phone home from an air-gapped environment
