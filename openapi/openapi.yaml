# ═══════════════════════════════════════════════════════════════════════════
# Sentinel-SLA — REST API specification (OpenAPI 3.0.3)
#
# Single source of truth for the HTTP surface, generated BY HAND from the real
# route handlers (src/app/api/**/route.ts) and the shared DTO contract
# (src/lib/types.ts) in the v2.0.0 release, and kept honest by three layers:
#
#   1. `bun run lint:spec`  — Spectral (oas3 ruleset + Sentinel rules) lints
#      this file in CI.
#   2. tests/integration/api-contract.mjs — walks this file, calls EVERY
#      endpoint against a live server and validates each response body
#      against the schema below (ajv).
#   3. tests/integration/test_stack.sh — structural invariants: every route
#      file in src/app/api must appear here (and vice versa), so the spec and
#      the code cannot drift silently.
#
# Contract rule (src/lib/types.ts): shapes extend additively — never break an
# existing field. Response schemas therefore deliberately do NOT set
# `additionalProperties: false`.
#
# Auth model (src/server/auth/session.ts): a `sentinel_session` HTTP-only
# cookie (browser) OR `Authorization: Bearer <api-token>` (machine). Roles
# owner > admin > engineer > executive > viewer (src/server/authz.ts).
# ═══════════════════════════════════════════════════════════════════════════
openapi: 3.0.3

info:
  title: Sentinel-SLA API
  version: 2.0.0
  description: >-
    The money-and-contract layer on top of Prometheus. Translates technical
    outages into executive financial impact — lost transactions and SLA
    penalties in integer Tomans — with Persian/Jalali executive surfaces and
    bilingual alerting (technical Telegram/Bale for engineers, executive
    briefs for the CEO). In demo mode the built-in simulation engine
    (2500 ms tick) produces the data; in live mode metrics are ingested from
    Prometheus/Alertmanager. Detection speed is self-tested with chaos
    experiments (MTTD gate).
  contact:
    name: Sentinel-SLA
    url: https://github.com/FontanisDev/sentinel-sla
  license:
    name: PolyForm-Noncommercial-1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0

servers:
  - url: /
    description: Same-origin (the UI is served by the same Next.js process)

security:
  - sessionCookie: []
  - bearerToken: []

tags:
  - name: health
    description: Liveness/readiness probes (public, used by kubelet/Helm)
  - name: onboarding
    description: Guided-setup checklist — read-only live counts per setup step
  - name: auth
    description: Sign-in, sign-out, first-run setup, session introspection
  - name: dashboard
    description: One snapshot powering the Overview page
  - name: engine
    description: Simulation engine control (demo mode)
  - name: chaos
    description: Chaos experiments — detection-speed self-tests (MTTD/MTTR)
  - name: incidents
    description: Incident lifecycle — feed, detail, acknowledge, resolve
  - name: services
    description: Monitored fleet membership, money models, probe sources
  - name: tenants
    description: Client companies owning service fleets (multi-tenancy)
  - name: alerts
    description: Bilingual notification feed (evidence trail)
  - name: analytics
    description: Error budgets, trends, availability heatmap
  - name: contracts
    description: Contract compliance view for the current Jalali month
  - name: maintenance
    description: Planned maintenance windows (alert suppression)
  - name: rules
    description: User-defined alert policy rules (alert governance)
  - name: channels
    description: Notification delivery channels (telegram/bale/webhook/email)
  - name: oncall
    description: On-call rotation entries
  - name: escalation
    description: Fleet escalation policy (unacked incidents page the secondary)
  - name: notifications
    description: Outbox + delivery log + message templates
  - name: reports
    description: PDF report archive, generation and download
  - name: schedules
    description: Cron-style report schedules and their run ledger
  - name: exports
    description: CSV/JSON data exports
  - name: metrics
    description: Live metric history ring-buffer
  - name: resilience
    description: Weekly self-test schedule, stats and run ledger
  - name: ai
    description: Rule-based/LLM incident post-mortem summaries
  - name: integrations
    description: Prometheus connection, executive digests, transport settings, webhooks
  - name: users
    description: Account management (admin)
  - name: audit
    description: Append-only audit trail (admin)

paths:
  /api/health/live:
    get:
      tags: [health]
      summary: Liveness probe
      description: Public. Fails only when the process cannot compute its own configuration (fail-fast boot contract).
      security: []
      operationId: getHealthLive
      responses:
        '200':
          description: Process alive and configuration valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
        '500':
          description: Configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'

  /api/health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: Public. Checks database reachability, data dir writability and engine/ingestion boot state.
      security: []
      operationId: getHealthReady
      responses:
        '200':
          description: All checks pass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '500':
          description: One or more checks fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'

  /api/onboarding:
    get:
      tags: [onboarding]
      summary: Getting-started checklist
      description: Read-only onboarding status — real counts per setup step (tenants, services excluding the self-test synthetic target, tenant-bound services, channels, reports) plus the signal-source state (stored Prometheus connection, or an honest demo-simulation marker in demo mode). Every role sees it; no configuration values are echoed.
      operationId: getOnboardingStatus
      responses:
        '200':
          description: Ordered checklist with live counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api:
    get:
      tags: [health]
      summary: API index
      description: Authenticated ping — proves the API surface answers behind the session.
      operationId: getApiIndex
      responses:
        '200':
          description: Greeting envelope
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/session:
    get:
      tags: [auth]
      summary: Session introspection
      description: Public by design — the login page calls it to decide where to route.
      security: []
      operationId: getAuthSession
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      description: Public. Sets the `sentinel_session` cookie. Rate-limited (10 attempts / 5 min); lockout after repeated failures; audited.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 120 }
                password: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Authenticated; cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Revokes the current session and clears the cookie. Audited.
      operationId: logout
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/setup:
    get:
      tags: [auth]
      summary: First-run availability
      description: 'Public. `available: true` when no account exists yet — the installer/first-run wizard keys off this.'
      security: []
      operationId: getSetupAvailability
      responses:
        '200':
          description: Setup availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
    post:
      tags: [auth]
      summary: Create the first owner account
      description: Public but one-shot — 403 once any account exists. Creates the owner, signs the session in, audited.
      security: []
      operationId: performSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email, maxLength: 120 }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Owner created; cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/dashboard:
    get:
      tags: [dashboard]
      summary: Overview snapshot
      description: >-
        One payload powering the Overview page: engine state, KPI strip, tenants (for the
        switcher), services with live series, recent incidents/alerts/chaos/reports,
        maintenance windows, alert rules, channels, on-call, escalation policy, report
        schedules and schedule runs. Tenant scope is enforced server-side
        (`?tenant=<id>` for scoped users; admin/owner see everything).
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Snapshot (demo or live data per deployment mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/engine:
    post:
      tags: [engine]
      summary: Control the simulation engine
      description: Demo mode only — pause/resume or switch simulation intensity (calm/normal/storm). Audited.
      operationId: controlEngine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineAction'
      responses:
        '200':
          description: New engine state
          content:
            application/json:
              schema:
                type: object
                required: [ok, engine]
                properties:
                  ok: { type: boolean }
                  engine:
                    $ref: '#/components/schemas/EngineState'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/chaos:
    get:
      tags: [chaos]
      summary: Recent chaos experiments
      description: Newest-first experiment history with MTTD/MTTR and the gate verdict per run.
      operationId: listChaosExperiments
      responses:
        '200':
          description: Newest-first experiment feed
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChaosExperiment'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [chaos]
      summary: Start a chaos experiment
      description: Injects an outage/latency/error-spike fault on one service for 10–300 s (default 45). The engine measures MTTD; gate target < 60 s. Audited.
      operationId: startChaosExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChaosPayload'
      responses:
        '201':
          description: Experiment started
          content:
            application/json:
              schema:
                type: object
                required: [experiment]
                properties:
                  experiment:
                    $ref: '#/components/schemas/ChaosExperiment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/chaos/auto:
    post:
      tags: [chaos]
      summary: Toggle automatic chaos
      description: When enabled, the engine starts a random experiment every 1–30 min (default 3). Audited.
      operationId: setAutoChaos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoChaosPayload'
      responses:
        '200':
          description: New auto-chaos state
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/incidents:
    get:
      tags: [incidents]
      summary: Incident feed
      description: Newest-first, optional status filter and inclusive `startedAt` bounds (the server twin of the UI TimeRange picker).
      operationId: listIncidents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { type: string, enum: [ongoing, resolved] }
        - name: since
          in: query
          description: Inclusive lower bound on startedAt (ISO datetime with offset)
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Inclusive upper bound on startedAt (ISO datetime with offset)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Incident page
          content:
            application/json:
              schema:
                type: object
                required: [incidents]
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/incidents/{id}:
    get:
      tags: [incidents]
      summary: Incident detail
      description: The /incidents/[id] page payload — the incident, notifications sent about it (evidence panel) and the other incidents of the same service (context panel).
      operationId: getIncident
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detail payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/incidents/{id}/acknowledge:
    post:
      tags: [incidents]
      summary: Acknowledge an incident
      description: On-call took ownership — stamps acknowledgedAt/by, computes MTTA, stops the escalation ladder. 409 when already acknowledged. Audited.
      operationId: acknowledgeIncident
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                by:
                  type: string
                  minLength: 2
                  maxLength: 40
                  description: Display handle of the acknowledger (defaults to the signed-in user)
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident:
                    $ref: '#/components/schemas/Incident'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Incident already acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/incidents/{id}/resolve:
    post:
      tags: [incidents]
      summary: Resolve an incident
      description: Manual close-out (the engine resolves automatically when the probe recovers). Computes MTTR/duration and freezes the money figures. Audited.
      operationId: resolveIncident
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident:
                    $ref: '#/components/schemas/Incident'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/services:
    get:
      tags: [services]
      summary: Service fleet
      description: All monitored services with live metrics, money models and probe-source configuration. Tenant scope enforced server-side.
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Fleet list
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [services]
      summary: Register a service
      description: Adds a monitored service with its money model. `key` must be a lowercase slug; unknown `tenantId` → 404. Audited.
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateService'
      responses:
        '201':
          description: Created service
          content:
            application/json:
              schema:
                type: object
                required: [service]
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Referenced tenant does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/services/{key}:
    get:
      tags: [services]
      summary: Service detail
      description: The /services/[key] page payload — live health DTO, current-Jalali-window contract row, recent incidents and the evidence trail (notifications + chaos).
      operationId: getServiceDetail
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Detail payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown service key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/services/preview:
    post:
      tags: [services]
      summary: Preview a probe source
      description: Onboarding wizard — evaluates an UNSAVED probe-source candidate against the configured Prometheus (last 60 min at 1-min steps); nothing is persisted. Requires the Prometheus connection (503 otherwise).
      operationId: previewServiceProbe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePreview'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                type: object
                required: [preview]
                properties:
                  preview:
                    $ref: '#/components/schemas/ProbePreview'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Prometheus connection not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/services/import:
    post:
      tags: [services]
      summary: Bulk CSV import of services + contract terms
      description: >-
        Customer onboarding: one CSV row = one monitored service
        with its SLA contract terms (slaTarget, penaltyBase, penaltyPerMinute,
        tier) — the same fields POST /api/services accepts. The sheet must
        have a header with at least `key` and `name` columns; nameFa, tenant
        (client key OR id), tier, endpoint, baseLatencyMs, tps,
        avgTransactionValue, slaTarget, penaltyBase, penaltyPerMinute and
        criticality are optional per row. RFC 4180 quoting, CRLF/LF and a
        UTF-8 BOM are handled; a template ships at
        /templates/services-import-template.csv. Caps: 200 data rows, 512 KB.
        `mode` defaults to dryRun (validates every row, writes nothing).
        Authz mirrors the single-service POST per row: engineer+ role; scoped
        users may only import into tenants they belong to; rows without a
        tenant require admin. Commit is all-or-nothing — any failing row
        aborts the whole import (422) with every failing row reported by
        physical CSV line; the engine picks the new services up on its next
        tick.
      operationId: importServicesCsv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: The CSV sheet text (header + up to 200 data rows)
                mode:
                  type: string
                  enum: [dryRun, commit]
                  default: dryRun
      responses:
        '200':
          description: Dry-run report — every row validated, zero writes
          content:
            application/json:
              schema:
                type: object
                required: [mode, total, ok, failed, rows, committed]
                properties:
                  mode: { type: string, enum: [dryRun, commit] }
                  total: { type: integer }
                  ok: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [line, ok]
                      properties:
                        line: { type: integer, description: Physical 1-based CSV line number }
                        key: { type: string }
                        name: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
                  committed: { type: boolean }
        '201':
          description: Committed — services created and picked up by the engine
          content:
            application/json:
              schema:
                type: object
                required: [mode, total, ok, failed, rows, committed, serviceIds]
                properties:
                  mode: { type: string, enum: [dryRun, commit] }
                  total: { type: integer }
                  ok: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [line, ok]
                      properties:
                        line: { type: integer }
                        key: { type: string }
                        name: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
                  committed: { type: boolean, enum: [true] }
                  serviceIds:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: CSV above the 512 KB size cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Commit aborted — per-row failures listed, nothing written
          content:
            application/json:
              schema:
                type: object
                required: [total, ok, failed, rows, committed, error]
                properties:
                  total: { type: integer }
                  ok: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [line, ok]
                      properties:
                        line: { type: integer }
                        key: { type: string }
                        name: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
                  committed: { type: boolean, enum: [false] }
                  error: { type: string }

  /api/services/{key}/tps-profile:
    post:
      tags: [services]
      summary: Import a Shaparak/PSP transaction-count CSV as the hour-of-week tps profile
      description: >-
        Shaparak/PSP-style transaction-count sources: parse a
        domestic PSP/Shaparak hourly transaction-count report and aggregate it
        into the 168-bucket hour-of-week tps profile the live money path
        resolves outages with. Two sheet shapes are accepted (headers in
        English or Persian): a timestamp column + a count column, or a
        date + hour + count triple. Dates may be Gregorian or Jalali; counts
        accept Latin, Persian and Arabic-Indic digits with thousands
        separators. Naive timestamps are read as Tehran wall clock (the
        calendar every domestic report uses); Iran has no DST since 2022.
        Caps: 2016 data rows, 512 KB. `mode` defaults to dryRun (parses,
        aggregates, previews the buckets, writes nothing). Commit is
        all-or-nothing — any rejected row aborts (422) with every rejection
        reported by physical CSV line, so money inputs are never silently
        partial. Audited. Engineer+ role; tenant-scoped users only for their
        own clients. A sample sheet ships at
        /templates/shaparak-tx-counts-sample.csv.
      operationId: importServiceTpsProfile
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: The CSV sheet text (header + up to 2016 hourly rows)
                mode:
                  type: string
                  enum: [dryRun, commit]
                  default: dryRun
      responses:
        '200':
          description: Dry-run report (zero writes) or the committed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpsProfileImportReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Service not found (or foreign to a scoped user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: CSV above the 512 KB size cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Commit aborted — rejections listed by line, nothing written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpsProfileImportReport'
    delete:
