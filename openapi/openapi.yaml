  /api/rules/import:
    post:
      tags: [rules]
      summary: Bulk import of Grafana or Zabbix alert rules
      description: >-
        Integrations: `source` selects the export format —
        'grafana' (default) accepts the JSON export of Grafana unified
        alerting ({"rules":[…]}, a bare rule array, or a single rule);
        'zabbix' accepts the JSON array returned by the Zabbix API's
        trigger.get (modern 5.4+ `last(/host/key)<10` and legacy
        `{host:key.func(p)}<10` expressions are both recognised). Each
        row's threshold expression is mapped onto one of the four Sentinel
        metrics. Recognised Grafana shapes: `up == 0` → uptime < 1; error
        families (error/fail/5xx filters) with a 0–1 threshold →
        errorRate; duration families with a declared unit suffix
        (_seconds/_ms; seconds convert to milliseconds) → latencyMs;
        counter rates over request/transaction families → throughput.
        Recognised Zabbix families: agent.ping/net.tcp.service = 0,
        nodata = 1, icmppingloss and web-scenario failures → uptime < 1
        (any availability loss); service.perf items (seconds) → latencyMs;
        request/transaction item rates → throughput. Host-resource
        triggers (CPU/memory/disk/network interfaces) are REFUSED —
        Sentinel monitors services, not hosts. Rows that do not match any
        shape are reported as unmapped with the exact reason — never
        silently guessed. A service label (Grafana) or trigger host
        (Zabbix) resolves against the registry by name or key
        (case-insensitive); an unknown label aborts the import. Disabled
        Zabbix triggers (status=1) are refused. Grafana's `for` pending
        duration becomes cooldownMin (clamped to the schema's 1–1440
        range, truncation noted); severity labels map to critical/warning
        (Grafana) and the 0–5 priority scale maps with transparent notes
        (Zabbix). `mode` defaults to dryRun (maps every row, writes
        nothing). Commit is all-or-nothing — any unmapped, duplicated or
        unknown-service row aborts the whole import (422). Created rules
        go through the same validation and governance path as POST
        /api/rules. Engineer-only. Audited. Caps: 200 rows, 512 KB.
        Sample exports ship at /templates/grafana-alerts-sample.json and
        /templates/zabbix-triggers-sample.json.
      operationId: importAlertRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [json]
              properties:
                json:
                  type: string
                  description: The export text (JSON) — Grafana rules or a Zabbix trigger list
                source:
                  type: string
                  enum: [grafana, zabbix]
                  default: grafana
                  description: Export format of the `json` text
                mode:
                  type: string
                  enum: [dryRun, commit]
                  default: dryRun
      responses:
        '200':
          description: Dry-run report — every rule mapped or refused, zero writes
          content:
            application/json:
              schema:
                type: object
                required: [mode, total, ok, failed, rows, committed]
                properties:
                  mode: { type: string, enum: [dryRun, commit] }
                  total: { type: integer }
                  ok: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [index, ok]
                      properties:
                        index: { type: integer, description: 0-based position in the export }
                        title: { type: string }
                        ok: { type: boolean }
                        error: { type: string, description: Refusal reason for unmapped rules }
                        rule:
                          type: object
                          properties:
                            name: { type: string }
                            metric: { type: string, enum: [uptime, errorRate, latencyMs, throughput] }
                            operator: { type: string, enum: [lt, gt] }
                            threshold: { type: number }
                            severity: { type: string, enum: [critical, warning] }
                            cooldownMin: { type: integer }
                            serviceLabel: { type: string }
                            notes:
                              type: array
                              items: { type: string }
                  committed: { type: boolean }
        '201':
          description: Committed — every mapped rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  committed: { type: boolean }
                  ruleIds:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: Import aborted — every failing rule reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  committed: { type: boolean }
                  error: { type: string }
                  total: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        ok: { type: boolean }
                        error: { type: string }

