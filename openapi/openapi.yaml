        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/escalation:
    get:
      tags: [escalation]
      summary: Escalation policy
      description: The single fleet policy — unacked incidents page the secondary after `timeoutMin`.
      operationId: getEscalationPolicy
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [escalation]
      summary: Edit the escalation policy
      description: Engineer-only, partial update; `timeoutMin` bounded 1–30. Audited.
      operationId: updateEscalationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEscalation'
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/notifications/outbox:
    get:
      tags: [notifications]
      summary: Outbox contents
      description: The transactional outbox — pending/delivered/dead notification envelopes with attempt counters.
      operationId: listOutbox
      parameters:
        - name: status
          in: query
          schema: { type: string, description: 'e.g. pending, delivering, delivered, dead' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Newest-first outbox rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboxItem'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [notifications]
      summary: Retry a dead-letter notification
      description: Admin-only. Re-enqueues a dead-lettered item (audited).
      operationId: retryOutboxItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/notifications/delivery:
    get:
      tags: [notifications]
      summary: Delivery log
      description: Per-attempt delivery outcomes (status code, latency, error), optionally filtered by channel.
      operationId: listDeliveryLog
      parameters:
        - name: channelId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest-first delivery rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryLogRow'
        '400':
          description: Unknown channelId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/templates:
    get:
      tags: [notifications]
      summary: Message templates
      description: The rendered message templates per transport plus whether the ack secret is configured (signed ack links).
      operationId: getNotificationTemplates
      responses:
        '200':
          description: Template inventory
          content:
            application/json:
              schema:
                type: object
                required: [transport, ackConfigured, templates]
                properties:
                  transport: { type: string }
                  ackConfigured: { type: boolean }
                  templates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/reports:
    get:
      tags: [reports]
      summary: Report archive
      description: Newest-first metadata for every generated PDF (executive, statement, incident), including its snapshot hash.
      operationId: listReports
      responses:
        '200':
          description: Newest-first report metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [reports]
      summary: Generate a report
      description: Executive-only. Three templates — `executive` (fleet), `statement` (per tenant, requires tenantId) and `incident` (requires incidentId) — each in `en` or `fa`, with a SHA-256 snapshot hash printed in the title block. Audited.
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [executive, statement, incident], default: executive }
                language: { type: string, enum: [en, fa], default: en }
                tenantId: { type: string, maxLength: 64 }
                incidentId: { type: string, maxLength: 64 }
      responses:
        '201':
          description: Generated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown tenantId/incidentId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/reports/{id}/download:
    get:
      tags: [reports]
      summary: Download a report PDF
      description: Streams the generated PDF for the archive/archive UI; the file is produced by the same pipeline in demo and live mode.
      operationId: downloadReport
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown report (or file missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/reports/{id}/regenerate:
    post:
      tags: [reports]
      summary: Regenerate a report
      description: Executive-only. Re-runs the same report over the same period/template with a fresh snapshot hash. Audited.
      operationId: regenerateReport
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201':
          description: The regenerated report (new id, fresh snapshot hash)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/schedules:
    get:
      tags: [schedules]
      summary: Report schedules
      description: Cron-style weekly/monthly schedules with computed `nextRunAt`. Weekly needs `dayOfWeek`; monthly needs `dayOfMonth` ≤ 28; `kind=statement` needs `tenantId`.
      operationId: listReportSchedules
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportSchedule'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [schedules]
      summary: Create a report schedule
      description: Engineer-only. Audited.
      operationId: createReportSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedule'
      responses:
        '201':
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSchedule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/schedules/runs:
    get:
      tags: [schedules]
      summary: Schedule run ledger
      description: Audit trail of schedule firings (due or manual), including failures with their first error line.
      operationId: listScheduleRuns
      responses:
        '200':
          description: Newest-first run ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleRun'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/schedules/{id}:
    delete:
      tags: [schedules]
      summary: Delete a schedule
      description: Engineer-only. Past runs remain in the ledger with the label snapshotted at run time. Audited.
      operationId: deleteReportSchedule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/schedules/{id}/run:
    post:
      tags: [schedules]
      summary: Run a schedule now
      description: Engineer-only. Fires the exact same pipeline the due-check uses (trigger `manual`); the result lands in the run ledger. Audited.
      operationId: runReportSchedule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The updated schedule (the firing itself lands in the run ledger — see GET /api/schedules/runs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSchedule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/schedules/{id}/toggle:
    post:
      tags: [schedules]
      summary: Enable/disable a schedule
      description: Engineer-only. Disabled schedules never fire; nextRunAt renders null. Audited.
      operationId: toggleReportSchedule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSchedule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/resilience:
    get:
      tags: [resilience]
      summary: Self-test state
      description: Weekly self-test schedule, 30-day stats, recent runs, recent chaos experiments and the live-mode chaos-hook inventory (presence only — hook values never echoed).
      operationId: getResilience
      responses:
        '200':
          description: Self-test state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfTestState'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [resilience]
      summary: Edit the self-test schedule
      description: Admin-only. `{ enabled, hour, dayOfWeek }`. Audited.
      operationId: updateResilienceSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                hour: { type: integer, minimum: 0, maximum: 23 }
                dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resilience]
      summary: Run the self-test now
      description: Engineer-only. Starts one self-test through the same path the scheduler uses; returns 202 immediately (measurement takes ~40–60 s) — poll GET while the run is `running`. 409 when one is already in flight. Audited.
      operationId: runResilienceSelfTest
      responses:
        '202':
          description: Self-test started
          content:
            application/json:
              schema:
                type: object
                required: [ok, started]
                properties:
                  ok: { type: boolean }
                  started: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A self-test is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/ai/postmortem:
    post:
      tags: [ai]
      summary: Generate a post-mortem summary
      description: Engineer-only. Summarizes the incident timeline (LLM when configured, rule-based fallback otherwise — `source` tells which). Audited.
      operationId: generatePostmortem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incidentId]
              properties:
                incidentId: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Summary result
          content:
            application/json:
              schema:
                type: object
                required: [summary, generatedAt, source]
                properties:
                  summary: { type: string }
                  generatedAt: { type: string, format: date-time }
                  source: { type: string, enum: [llm, heuristic] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/integrations/prometheus:
    get:
      tags: [integrations]
      summary: Prometheus connection status
      description: Admin-only. Auth material is masked — kinds and presence only, never values.
      operationId: getPrometheusConnection
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [integrations]
      summary: Set the Prometheus connection
      description: Admin-only. Persists baseUrl + auth into IntegrationSetting (DB-managed, not env). Audited.
      operationId: putPrometheusConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusPut'
      responses:
        '200':
          description: Saved (masked echo)
          content:
            application/json:
              schema:
                type: object
                required: [ok, baseUrl, auth]
                properties:
                  ok: { type: boolean }
                  baseUrl: { type: string, nullable: true }
                  auth: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/integrations/prometheus/test:
    post:
      tags: [integrations]
      summary: Test the Prometheus connection
      description: Admin-only. Probes the (candidate or saved) connection and reports reachability.
      operationId: testPrometheusConnection
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusPut'
      responses:
        '200':
          description: Reachability result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/integrations/notify:
    get:
      tags: [integrations]
      summary: Notification transport settings
      description: Admin-only. Bot-token presence flags only — values never echoed.
      operationId: getNotifySettings
      responses:
        '200':
          description: Transport status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [integrations]
      summary: Set the notification transport
      description: Admin-only. Chooses telegram/bale as the executive+technical transport. Audited.
      operationId: putNotifySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transport]
              properties:
                transport: { type: string, enum: [telegram, bale] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, transport]
                properties:
                  ok: { type: boolean }
                  transport: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/integrations/digest:
    get:
      tags: [integrations]
      summary: Executive digest schedule
      description: Admin-only. Frequency/hour/day plus the next due instant.
      operationId: getDigestSettings
      responses:
        '200':
          description: Digest schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [integrations]
      summary: Edit the digest schedule
      description: 'Admin-only. `{ frequency: off|daily|weekly, hour, dayOfWeek? }`. Audited.'
      operationId: putDigestSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency, hour]
              properties:
                frequency: { type: string, enum: [off, daily, weekly] }
                hour: { type: integer, minimum: 0, maximum: 23 }
                dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
      responses:
        '200':
          description: Saved schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [integrations]
      summary: Send the digest now
      description: Admin-only. Runs the exact scheduler path; reports the enqueued count honestly (and the error when digest-disabled or fan-out fails). Audited.
      operationId: runDigestNow
      responses:
        '200':
          description: Fan-out result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  enqueued: { type: integer }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/integrations/alertmanager:
    post:
      tags: [integrations]
      summary: Alertmanager webhook receiver
      description: >-
        Public by design — the shared secret IS the authentication (checked against the
        configured alertmanager secret; 503 when none is set, 401 on mismatch). Ingests
        Alertmanager webhook payloads into Sentinel incidents in live mode.
      security: []
      operationId: alertmanagerWebhook
      responses:
        '200':
          description: Payload accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          description: Secret mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: No alertmanager secret configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/integrations/telegram/callback:
    post:
      tags: [integrations]
      summary: Telegram/Bale ACK callback
      description: >-
        Public webhook for button presses coming back from Telegram/Bale messages.
        Authentication is the callback secret resolved from settings (503 when the
        callback is not configured, 401 on a secret mismatch); the signed ack token
        inside the payload is then verified against the ack secret. A business-level
        verdict — including a bad/expired token — is reported as `{ok:false}` with 200
        so the chat platform does not retry-spam.
      security: []
      operationId: telegramAckCallback
      responses:
        '200':
          description: Callback processed (business verdict — ok may be false)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string, nullable: true }
        '401':
          description: Callback secret mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: Telegram callback or ack secret not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/users:
    get:
      tags: [users]
      summary: Account list
      description: Admin-only. Accounts with global role, locale, disabled flag, last sign-in and memberships.
      operationId: listUsers
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: Create an account
      description: Admin-only. Password policy enforced (≥12 chars, no repeated-char runs, no trivial words); global role `owner` requires the caller to be the owner; memberships reference existing tenants. Audited.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation failure (including password policy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{id}:
    patch:
      tags: [users]
      summary: Edit an account
      description: Admin-only. Guards — the last enabled owner cannot demote/disable/delete themselves; only the owner edits an owner row. Audited.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUser'
      responses:
        '200':
          description: Update result (no-op patches short-circuit with unchanged)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  unchanged: { type: boolean }
                  user:
                    $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [users]
      summary: Delete an account
      description: Owner-only; the owner account itself cannot be deleted. Audited.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/sessions:
    delete:
      tags: [users]
      summary: Revoke an account's sessions (sign-out-everywhere)
      description: Admin-only; ending the owner's sessions requires the owner. Audited.
      operationId: revokeUserSessions
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/audit:
    get:
      tags: [audit]
      summary: Audit trail
      description: Admin-only, append-only. Returns recent entries plus the distinct action vocabulary for the filter UI.
      operationId: listAuditTrail
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: action
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Entries + action vocabulary
          content:
            application/json:
              schema:
                type: object
                required: [entries, actions]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  actions:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sentinel_session
      description: HTTP-only session cookie set by POST /api/auth/login (or the first-run setup).
    bearerToken:
      type: http
      scheme: bearer
      description: Machine API token (hashed, prefix-visible, expiring) resolved by src/server/auth/session.ts.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    TenantQuery:
      name: tenant
      in: query
      description: Tenant id to scope by (admin/owner may omit for fleet-wide; scoped users must hold a membership — see resolveTenantScope).
      schema: { type: string, maxLength: 64 }

  responses:
    BadRequest:
      description: Validation failed (zod) or malformed input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient role or out-of-scope tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many attempts (Retry-After honoured)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ── shared envelopes ───────────────────────────────────────────────
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details:
          description: Field-level messages (zod issues) — present on validation failures
          type: array
          items: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    # ── health ─────────────────────────────────────────────────────────
    HealthLive:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, fail] }
        service: { type: string }
        mode: { type: string, enum: [demo, live] }
        error: { type: string, nullable: true }
    HealthReady:
      type: object
      required: [status, checks, ts]
      properties:
        status: { type: string, enum: [ok, fail] }
        ts: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              detail: { type: string, nullable: true }

    # ── auth ───────────────────────────────────────────────────────────
    SessionInfo:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            role: { $ref: '#/components/schemas/Role' }
            locale: { type: string, enum: [en, fa] }
    LoginResponse:
      type: object
      required: [ok, user]
      properties:
        ok: { type: boolean }
        user:
          type: object
          required: [id, name, email, role, locale]
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            role: { $ref: '#/components/schemas/Role' }
            locale: { type: string, enum: [en, fa] }
    Role:
      type: string
      enum: [owner, admin, engineer, executive, viewer]

    # ── engine / dashboard ─────────────────────────────────────────────
    EngineAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, set-mode] }
        mode: { type: string, enum: [calm, normal, storm] }
    EngineState:
      type: object
      required: [running, startedAt, tickCount, tickIntervalMs, mode, autoChaos, autoChaosIntervalMin, deploymentMode]
      properties:
        running: { type: boolean }
        startedAt: { type: string, format: date-time }
        tickCount: { type: integer }
        tickIntervalMs: { type: integer }
        mode: { type: string, enum: [calm, normal, storm] }
        autoChaos: { type: boolean }
        autoChaosIntervalMin: { type: integer }
        nextAutoChaosAt: { type: string, format: date-time, nullable: true }
        lastChaosResult: { type: string, nullable: true }
        deploymentMode: { type: string, enum: [demo, live] }
    Kpi:
      type: object
      required: [fleetUptime, activeIncidents, incidentsTotal, lostRevenueTomans, penaltyExposureTomans, transactionsLost, slaCompliantServices, totalServices, outboxDepth, outboxDead]
      properties:
        fleetUptime: { type: number, minimum: 0, maximum: 1 }
        activeIncidents: { type: integer }
        incidentsTotal: { type: integer }
        lostRevenueTomans: { type: integer, description: integer Tomans }
        penaltyExposureTomans: { type: integer, description: integer Tomans }
        transactionsLost: { type: integer }
        avgMttdSec: { type: number, nullable: true }
        avgMttrSec: { type: number, nullable: true }
        avgMttaSec: { type: number, nullable: true }
        escalatedIncidents: { type: integer }
        slaCompliantServices: { type: integer }
        totalServices: { type: integer }
        lastIncidentAt: { type: string, format: date-time, nullable: true }
        outboxDepth: { type: integer }
        outboxDead: { type: integer }
    Dashboard:
      type: object
      required: [engine, kpis, tenants, tenantScope, services, incidents, alerts, chaosExperiments, reports, maintenanceWindows, alertRules, channels, onCall, escalationPolicy, reportSchedules, scheduleRuns, serverTime]
      properties:
        engine: { $ref: '#/components/schemas/EngineState' }
        kpis: { $ref: '#/components/schemas/Kpi' }
        tenants:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        tenantScope: { type: string, nullable: true }
        services:
          type: array
          items: { $ref: '#/components/schemas/Service' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        chaosExperiments:
          type: array
          items: { $ref: '#/components/schemas/ChaosExperiment' }
        reports:
          type: array
          items: { $ref: '#/components/schemas/Report' }
        maintenanceWindows:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceWindow' }
        alertRules:
          type: array
          items: { $ref: '#/components/schemas/AlertRule' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
        onCall:
          type: array
          items: { $ref: '#/components/schemas/OnCallEntry' }
        escalationPolicy: { $ref: '#/components/schemas/EscalationPolicy' }
        reportSchedules:
          type: array
          items: { $ref: '#/components/schemas/ReportSchedule' }
        scheduleRuns:
          type: array
          items: { $ref: '#/components/schemas/ScheduleRun' }
        serverTime: { type: string, format: date-time }

    # ── fleet domain ───────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, key, name, servicesCount]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        nameFa: { type: string, nullable: true }
        servicesCount: { type: integer }
    ProbeSource:
      description: Where a service's live signal comes from (discriminated union).
      oneOf:
        - type: object
          required: [kind, job]
          properties:
            kind: { type: string, enum: [blackbox] }
            job: { type: string, maxLength: 120 }
            instance: { type: string, maxLength: 300 }
        - type: object
          required: [kind, good, total]
          properties:
            kind: { type: string, enum: [promql] }
            good: { type: string, maxLength: 500 }
            total: { type: string, maxLength: 500 }
        - type: object
          required: [kind, alert]
          properties:
            kind: { type: string, enum: [alertmanager] }
            alert: { type: string, maxLength: 120 }
            matcher: { type: string, maxLength: 300 }
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [synthetic] }
    MetricSeries:
      type: object
      description: Live ring-buffer, oldest first, equal-length parallel arrays.
      required: [ts, latencyMs, errorRate, throughput, status]
      properties:
        ts:
          type: array
          items: { type: integer, description: epoch ms }
        latencyMs:
          type: array
          items: { type: number }
        errorRate:
          type: array
          items: { type: number }
        throughput:
          type: array
          items: { type: number }
        status:
          type: array
          items: { type: number, description: '1 = up, 0.5 = degraded, 0 = down' }
    Service:
      type: object
      required: [id, key, name, tier, criticality, status, latencyMs, errorRate, throughput, tps, avgTransactionValue, slaTarget, penaltyBase, penaltyPerMinute, uptime, incidentsCount, lostTransactions, revenueLossTomans, penaltyTomans, series]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        nameFa: { type: string, nullable: true }
        tier: { type: string }
        endpoint: { type: string }
        criticality: { type: string }
        tenantId: { type: string, nullable: true }
        tenantName: { type: string, nullable: true }
        liveStatus: { type: string, enum: [up, down, stale], nullable: true }
        probeSource:
          description: null = simulation-only service
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProbeSource'
        status: { type: string, enum: [up, degraded, down] }
        latencyMs: { type: number }
        errorRate: { type: number }
        throughput: { type: number }
        tps: { type: number }
        avgTransactionValue: { type: number, description: Tomans }
        slaTarget: { type: number }
        penaltyBase: { type: number, description: Tomans per incident }
        penaltyPerMinute: { type: number, description: Tomans per minute }
        uptime: { type: number }
        incidentsCount: { type: integer }
        lostTransactions: { type: integer }
        revenueLossTomans: { type: integer }
        penaltyTomans: { type: integer }
        series: { $ref: '#/components/schemas/MetricSeries' }
    ServiceDetail:
      type: object
      required: [service, contract, tpsProfile, incidents, alerts, chaos]
      properties:
        service: { $ref: '#/components/schemas/Service' }
        contract: { $ref: '#/components/schemas/ContractServiceRow' }
        tpsProfile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TpsProfileSummary'
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        chaos:
          type: array
          items: { $ref: '#/components/schemas/ChaosExperiment' }
    TpsProfileSummary:
      type: object
      description: Which money source drives the service's tps.
      required: [active, tps, meanTps, peak, coveredBuckets, importedAt, importedBy]
      properties:
        active: { type: boolean, description: true = an imported profile drives live money }
        tps: { type: number, description: the flat tps column (fallback / comparison) }
        meanTps: { type: number, nullable: true }
        peak:
          type: object
          nullable: true
          required: [bucket, tps]
          properties:
            bucket: { type: integer, minimum: 0, maximum: 167 }
            tps: { type: number }
        coveredBuckets: { type: integer, nullable: true, minimum: 0, maximum: 168 }
        importedAt: { type: string, format: date-time, nullable: true }
        importedBy: { type: string, nullable: true }
    TpsProfileImportReport:
      type: object
      required: [mode, committed, service, shape, rowsUsed, rowsRejected, rejected, window, coverage, meanTps, peak, trough, tzOffsetMinutes, buckets]
      properties:
        mode: { type: string, enum: [dryRun, commit] }
        committed: { type: boolean }
        service:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        shape: { type: string, enum: [timestamped, calendar] }
        rowsUsed: { type: integer, minimum: 0 }
        rowsRejected: { type: integer, minimum: 0 }
        rejected:
          type: array
          items:
            type: object
            required: [line, reason]
            properties:
              line: { type: integer, description: Physical 1-based CSV line number }
              reason: { type: string }
        window:
          type: object
          nullable: true
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        coverage:
          type: object
          required: [coveredBuckets, of, percent]
          properties:
            coveredBuckets: { type: integer, minimum: 0, maximum: 168 }
            of: { type: integer, enum: [168] }
            percent: { type: number }
        meanTps: { type: number, nullable: true }
        peak:
          type: object
          nullable: true
          required: [bucket, tps]
          properties:
            bucket: { type: integer, minimum: 0, maximum: 167 }
            tps: { type: number }
        trough:
          type: object
          nullable: true
          required: [bucket, tps]
          properties:
            bucket: { type: integer, minimum: 0, maximum: 167 }
            tps: { type: number }
        tzOffsetMinutes: { type: integer, description: Tehran = 210 (no DST) }
        buckets:
          type: array
          items: { type: number }
          minItems: 168
          maxItems: 168
        error: { type: string }
    CreateService:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 2, maxLength: 64 }
        name: { type: string, minLength: 2, maxLength: 80 }
        nameFa: { type: string, maxLength: 120 }
        probeSource: { $ref: '#/components/schemas/ProbeSource' }
        tenantId: { type: string, maxLength: 64 }
        tier: { type: string, maxLength: 20 }
        endpoint: { type: string, pattern: '^https?://', maxLength: 300 }
        baseLatencyMs: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 10000 }
        tps: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 100000 }
        avgTransactionValue: { type: number, minimum: 0, exclusiveMinimum: true }
        slaTarget: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1, exclusiveMaximum: true }
        penaltyBase: { type: number, minimum: 0, exclusiveMinimum: true }
        penaltyPerMinute: { type: number, minimum: 0, exclusiveMinimum: true }
        criticality: { type: string, enum: [critical, high, medium, low] }
    ServicePreview:
      type: object
      required: [probeSource]
      properties:
        probeSource: { $ref: '#/components/schemas/ProbeSource' }
        endpoint: { type: string, pattern: '^https?://', maxLength: 300 }
        slaTarget: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1, exclusiveMaximum: true }
        tenantId: { type: string, maxLength: 64 }
    ProbePreview:
      type: object
      description: Result of evaluating a probe-source candidate over the last 60 min.
      required: [kind, query, windowMinutes, series]
      properties:
        kind: { type: string }
        query: { type: string }
        windowMinutes: { type: integer }
        series:
          type: array
          items:
            type: object
            additionalProperties: true
        okRatio: { type: number, nullable: true }
        lastValue: { type: number, nullable: true }
        note: { type: string, nullable: true }

    # ── incidents ──────────────────────────────────────────────────────
    ChaosPayload:
      type: object
      required: [serviceId, type]
      properties:
        serviceId: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [outage, latency, error-spike] }
        durationSec: { type: number, description: clamped to 10–300 by the route }
    AutoChaosPayload:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        intervalMin: { type: number, description: clamped to 1–30 by the route }
    ChaosExperiment:
      type: object
      required: [id, serviceId, serviceName, type, status, startedAt, plannedDurationSec]
      properties:
        id: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        type: { type: string, enum: [outage, latency, error-spike] }
        status: { type: string, enum: [running, passed, failed, aborted] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        plannedDurationSec: { type: integer }
        mttdSec: { type: number, nullable: true }
        mttrSec: { type: number, nullable: true }
        gatePassed: { type: boolean, nullable: true }
    IncidentEvent:
      type: object
      required: [ts, event]
      properties:
        ts: { type: string, format: date-time }
        event: { type: string, description: fault_started | probe_failed | detected | resolved | … }
        detail: { type: string }
    Incident:
      type: object
      required: [id, serviceId, serviceName, serviceKey, status, severity, source, startedAt, lostTransactions, revenueLossTomans, penaltyTomans, events]
      properties:
        id: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        serviceKey: { type: string }
        status: { type: string, enum: [ongoing, resolved] }
        severity: { type: string, enum: [critical, warning] }
        source: { type: string, enum: [spontaneous, chaos, manual] }
        startedAt: { type: string, format: date-time }
        detectedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        mttdSec: { type: number, nullable: true }
        mttrSec: { type: number, nullable: true }
        mttaSec: { type: number, nullable: true }
        durationSec: { type: number, nullable: true }
        lostTransactions: { type: integer }
        revenueLossTomans: { type: integer }
        penaltyTomans: { type: integer }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        acknowledgedBy: { type: string, nullable: true }
        escalatedAt: { type: string, format: date-time, nullable: true }
        escalatedTo: { type: string, nullable: true }
        aiSummary: { type: string, nullable: true }
        aiSource: { type: string, enum: [llm, heuristic], nullable: true }
        chaosExperimentId: { type: string, nullable: true }
        moneyModel:
          type: object
          nullable: true
          required: [tps, avgTransactionValue, penaltyBase, penaltyPerMinute]
          properties:
            tps: { type: number }
            avgTransactionValue: { type: number }
            penaltyBase: { type: number }
            penaltyPerMinute: { type: number }
        events:
          type: array
          items: { $ref: '#/components/schemas/IncidentEvent' }
    IncidentDetail:
      type: object
      required: [incident, alerts, related]
      properties:
        incident: { $ref: '#/components/schemas/Incident' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        related:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
    Alert:
      type: object
      required: [id, serviceName, channel, audience, severity, title, message, status, sentAt]
      properties:
        id: { type: string }
        incidentId: { type: string, nullable: true }
        serviceName: { type: string }
        channel: { type: string }
        audience: { type: string, enum: [technical, executive] }
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string }
        message: { type: string }
        status: { type: string }
        sentAt: { type: string, format: date-time }

    # ── analytics / contracts ──────────────────────────────────────────
    ErrorBudget:
      type: object
      required: [serviceId, serviceKey, serviceName, slaTarget, windowHours, allowedDowntimeSec, consumedDowntimeSec, remainingSec, remainingRatio, status, burnRatePerHour]
      properties:
        serviceId: { type: string }
        serviceKey: { type: string }
        serviceName: { type: string }
        slaTarget: { type: number }
        windowHours: { type: number }
        allowedDowntimeSec: { type: number, description: (1 − target) × window }
        consumedDowntimeSec: { type: number, description: critical = full duration; warning = ½ }
        remainingSec: { type: number, description: negative on overrun }
        remainingRatio: { type: number }
        status: { type: string, enum: [healthy, burning, exhausted] }
        burnRatePerHour: { type: number }
        projectedExhaustionSec: { type: number, nullable: true }
    TrendPoint:
      type: object
      required: [ts, incidents, penaltyTomans]
      properties:
        ts: { type: string, format: date-time }
        incidents: { type: integer }
        mttdSec: { type: number, nullable: true }
        mttrSec: { type: number, nullable: true }
        mttaSec: { type: number, nullable: true }
        penaltyTomans: { type: integer }
    HeatmapBucket:
      type: object
      required: [ts, services]
      properties:
        ts: { type: integer, description: 'epoch ms, bucket start' }
        services:
          type: object
          description: per-service availability score keyed by service key
          additionalProperties:
            type: number
            nullable: true
            description: 1 = up, 0.5 = degraded, 0 = down; null = no snapshots
    Analytics:
      type: object
      required: [windowHours, errorBudgets, trends, heatmap]
      properties:
        windowHours: { type: number }
        errorBudgets:
          type: array
          items: { $ref: '#/components/schemas/ErrorBudget' }
        trends:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
        heatmap:
          type: object
          required: [bucketSizeMin, buckets]
          properties:
            bucketSizeMin: { type: integer }
            buckets:
              type: array
              items: { $ref: '#/components/schemas/HeatmapBucket' }
    ContractServiceRow:
      type: object
      required: [serviceId, serviceKey, serviceName, targetPct, penaltyBase, penaltyPerMinute, downtimeSec, billedMinutes, elapsedSec, compliance, penaltyToDate, plannedWindows, plannedSec, incidentsCount]
      properties:
        serviceId: { type: string }
        serviceKey: { type: string }
        serviceName: { type: string }
        serviceNameFa: { type: string, nullable: true }
        tenantId: { type: string, nullable: true }
        tenantName: { type: string, nullable: true }
        tenantNameFa: { type: string, nullable: true }
        targetPct: { type: number, description: slaTarget × 100 }
        penaltyBase: { type: number }
        penaltyPerMinute: { type: number }
        downtimeSec: { type: integer }
        billedMinutes: { type: integer, description: 'ceil rule, 1-minute minimum' }
        elapsedSec: { type: integer }
        availabilityPct: { type: number, nullable: true }
        compliance: { type: string, enum: [compliant, breach, pending] }
        penaltyToDate: { type: integer }
        projectedPenalty: { type: integer, nullable: true }
        plannedWindows: { type: integer }
        plannedSec: { type: integer }
        incidentsCount: { type: integer }
    ContractsSnapshot:
      type: object
      required: [window, generatedAt, elapsedSec, totals, rows]
      properties:
        window:
          type: object
          required: [start, end, jy, jm, lengthSec]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            jy: { type: integer, description: Jalali year }
            jm: { type: integer, description: Jalali month 1–12 }
            labelEn: { type: string, example: 'Mehr 1405' }
            labelFa: { type: string, example: 'مهر ۱۴۰۵' }
            lengthSec: { type: integer }
        generatedAt: { type: string, format: date-time }
        elapsedSec: { type: integer }
        totals:
          type: object
          required: [tenants, services, breaches, penaltyToDate, plannedWindows]
          properties:
            tenants: { type: integer }
            services: { type: integer }
            breaches: { type: integer }
            penaltyToDate: { type: integer }
            projectedPenalty: { type: integer, nullable: true }
            plannedWindows: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ContractServiceRow' }
    IncidentExportRow:
      type: object
      description: One row of the incidents JSON export (CSV columns identical).
      required: [id, service, severity, status, source, detected, resolved, transactionsLost, revenueLossTomans, penaltyTomans]
      properties:
        id: { type: string }
        service: { type: string }
        severity: { type: string }
        status: { type: string }
        source: { type: string }
        detected: { type: string, description: ISO or '' }
        resolved: { type: string, description: ISO or '' }
        mttdSec: { type: number, nullable: true }
        mttrSec: { type: number, nullable: true }
        durationSec: { type: number, nullable: true }
        transactionsLost: { type: integer }
        revenueLossTomans: { type: integer }
        penaltyTomans: { type: integer }

    # ── maintenance ────────────────────────────────────────────────────
    MaintenanceWindow:
      type: object
      required: [id, serviceId, serviceName, reason, status, startAt, endAt, createdAt, createdBy, suppressedAlerts]
      properties:
        id: { type: string }
        serviceId: { type: string, nullable: true, description: null = fleet-wide }
        serviceName: { type: string, nullable: true }
        tenantId: { type: string, nullable: true }
        reason: { type: string }
        status: { type: string, enum: [active, expired, cancelled] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        suppressedAlerts: { type: integer }

    # ── alert governance ───────────────────────────────────────────────
    CreateRule:
      type: object
      required: [name, metric, operator, threshold]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        serviceId: { type: string, nullable: true, description: null/omit = fleet rule }
        metric: { type: string, enum: [uptime, errorRate, latencyMs, throughput] }
        operator: { type: string, enum: [lt, gt] }
        threshold: { type: number }
        severity: { type: string, enum: [critical, warning] }
        audience: { type: string, enum: [technical, executive, both] }
        cooldownMin: { type: integer, minimum: 1, maximum: 1440 }
        quietStartMin: { type: integer, minimum: 0, maximum: 1439, nullable: true }
        quietEndMin: { type: integer, minimum: 0, maximum: 1440, nullable: true }
    AlertRule:
      type: object
      required: [id, name, metric, operator, threshold, severity, audience, cooldownMin, enabled, timesFired, createdAt, violatedNow]
      properties:
        id: { type: string }
        name: { type: string }
        serviceId: { type: string, nullable: true }
        serviceName: { type: string, nullable: true }
        metric: { type: string, enum: [uptime, errorRate, latencyMs, throughput] }
        operator: { type: string, enum: [lt, gt] }
        threshold: { type: number }
        severity: { type: string, enum: [critical, warning] }
        audience: { type: string, enum: [technical, executive, both] }
        cooldownMin: { type: integer }
        quietStartMin: { type: integer, nullable: true }
        quietEndMin: { type: integer, nullable: true }
        enabled: { type: boolean }
        timesFired: { type: integer }
        lastFiredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        violatedNow: { type: boolean }
        measuredValue: { type: number, nullable: true }
        violatedServiceName: { type: string, nullable: true }
    OnboardingStep:
      type: object
      required: [id, done, count, href, demoSignalSource]
      properties:
        id: { type: string, enum: [prometheus, tenants, services, clients, channels, report] }
        done: { type: boolean }
        count: { type: integer, nullable: true, description: "Live count behind the step; null for the config-lookup step (prometheus)." }
        href: { type: string }
        demoSignalSource: { type: boolean, description: "True only on the prometheus step in demo mode without a stored connection — the demo simulation is the signal source, labelled honestly." }
    OnboardingStatus:
      type: object
      required: [steps, done, total, allDone, mode]
      properties:
        steps: { type: array, items: { $ref: '#/components/schemas/OnboardingStep' } }
        done: { type: integer }
        total: { type: integer }
        allDone: { type: boolean }
        mode: { type: string, enum: [demo, live] }
    CreateChannel:
      type: object
      required: [name, kind, target]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        kind: { type: string, enum: [telegram, bale, webhook, email, mattermost, jira, redmine] }
        target: { type: string, minLength: 3, maxLength: 500 }
        audience: { type: string, enum: [technical, executive, both] }
        secret: { type: string, minLength: 8, maxLength: 200, nullable: true }
        settings: { type: object, nullable: true, description: "Per-kind non-secret config. jira: {projectKey, issueTypeName?}; redmine: {projectId}; mattermost: {channel?, username?}. Required for jira/redmine; rejected for other kinds." , additionalProperties: true}
    UpdateChannel:
      type: object
      description: PATCH semantics — absent = keep, null = clear (where allowed), value = replace.
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        target: { type: string, minLength: 3, maxLength: 500 }
        audience: { type: string, enum: [technical, executive, both] }
        enabled: { type: boolean }
        secret: { type: string, minLength: 8, maxLength: 200, nullable: true }
        settings: { type: object, nullable: true, additionalProperties: true }
    NotificationChannel:
      type: object
      description: Signing secrets are stored but never echoed. settings (non-secret per-kind config) is echoed.
      required: [id, name, kind, target, audience, enabled, deliveredCount, failedCount, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [telegram, bale, webhook, email, mattermost, jira, redmine] }
        target: { type: string }
        audience: { type: string, enum: [technical, executive, both] }
        enabled: { type: boolean }
        deliveredCount: { type: integer }
        failedCount: { type: integer }
        lastDeliveryAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        settings: { type: object, nullable: true, additionalProperties: true }
        status: { type: string, enum: [healthy, degraded, disabled] }
        createdAt: { type: string, format: date-time }
    CreateOnCall:
      type: object
      required: [engineerName, role, handle, dayOfWeek, startMinute, endMinute]
      properties:
        engineerName: { type: string, minLength: 3, maxLength: 60 }
        role: { type: string, minLength: 2, maxLength: 40 }
        handle: { type: string, minLength: 3, maxLength: 80 }
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 1, maximum: 1440 }
    OnCallEntry:
      type: object
      required: [id, engineerName, role, handle, dayOfWeek, startMinute, endMinute, active]
      properties:
        id: { type: string }
        engineerName: { type: string }
        role: { type: string }
        handle: { type: string }
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        startMinute: { type: integer }
        endMinute: { type: integer }
        active: { type: boolean }
    UpdateEscalation:
      type: object
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        timeoutMin: { type: integer, minimum: 1, maximum: 30 }
        appliesTo: { type: string, enum: [critical, all] }
        enabled: { type: boolean }
    EscalationPolicy:
      type: object
      required: [id, name, timeoutMin, appliesTo, enabled, timesEscalated, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        timeoutMin: { type: integer }
        appliesTo: { type: string, enum: [critical, all] }
        enabled: { type: boolean }
        timesEscalated: { type: integer }
        lastEscalatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── notifications plumbing ─────────────────────────────────────────
    OutboxItem:
      type: object
      required: [id, topic, severity, audience, kind, title, status, attempts, maxAttempts, availableAt, createdAt, test]
      properties:
        id: { type: string }
        topic: { type: string }
        severity: { type: string }
        audience: { type: string }
        kind: { type: string }
        target: { type: string, nullable: true }
        title: { type: string }
        status: { type: string }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastError: { type: string, nullable: true }
        availableAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        test: { type: boolean }
    DeliveryLogRow:
      type: object
      required: [id, outboxId, kind, ok, latencyMs, at]
      properties:
        id: { type: string }
        outboxId: { type: string }
        channelId: { type: string, nullable: true }
        kind: { type: string }
        ok: { type: boolean }
        statusCode: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        ref: { type: string, nullable: true, description: "Created-ticket reference for ticketing kinds (Jira issue key, Redmine #id); null otherwise." }
        latencyMs: { type: integer }
        at: { type: string, format: date-time }
        title: { type: string, nullable: true }
        severity: { type: string, nullable: true }
        test: { type: boolean, nullable: true }

    # ── reports / schedules ────────────────────────────────────────────
    Report:
      type: object
      required: [id, periodStart, periodEnd, generatedAt, fileName, fileSize, generatedBy, kind, language, snapshotHash]
      properties:
        id: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        fileName: { type: string }
        fileSize: { type: integer }
        generatedBy: { type: string }
        kind: { type: string, enum: [executive, statement, incident] }
        language: { type: string, enum: [en, fa] }
        subjectId: { type: string, nullable: true, description: 'incident (incident) / tenant (statement) / null (fleet executive)' }
        snapshotHash: { type: string, description: SHA-256 of the canonical data snapshot }
    CreateSchedule:
      type: object
      required: [label, frequency, hour]
      properties:
        label: { type: string, minLength: 3, maxLength: 80 }
        frequency: { type: string, enum: [weekly, monthly] }
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: required for weekly }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28, description: required for monthly }
        hour: { type: integer, minimum: 0, maximum: 23 }
        periodHours: { type: integer, enum: [1, 6, 24] }
        kind: { type: string, enum: [executive, statement] }
        language: { type: string, enum: [en, fa] }
        tenantId: { type: string, maxLength: 64, description: required for kind=statement }
        enabled: { type: boolean }
    ReportSchedule:
      type: object
      required: [id, label, frequency, hour, periodHours, kind, language, enabled, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        frequency: { type: string, enum: [weekly, monthly] }
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, nullable: true }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28, nullable: true }
        hour: { type: integer }
        periodHours: { type: integer }
        kind: { type: string, enum: [executive, statement] }
        language: { type: string, enum: [en, fa] }
        tenantId: { type: string, nullable: true }
        tenantName: { type: string, nullable: true }
        enabled: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true, description: null when disabled }
        createdAt: { type: string, format: date-time }
    ScheduleRun:
      type: object
      required: [id, scheduleId, label, trigger, startedAt, durationMs, success]
      properties:
        id: { type: string }
        scheduleId: { type: string }
        label: { type: string, description: snapshotted at run time — survives renames/deletes }
        trigger: { type: string, enum: [due, manual] }
        startedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        success: { type: boolean }
        reportId: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        fileSize: { type: integer, nullable: true }
        error: { type: string, nullable: true, description: first line of the failure reason }

    # ── resilience ─────────────────────────────────────────────────────
    SelfTestState:
      type: object
      required: [mode, config, nextRunAt, stats, running, runs, chaosExperiments, chaosHooks]
      properties:
        mode: { type: string, enum: [demo, live] }
        config:
          type: object
          description: weekly schedule { enabled, hour, dayOfWeek }
          additionalProperties: true
        nextRunAt: { type: string, format: date-time, nullable: true }
        stats:
          type: object
          description: 30-day aggregate (runs, pass count, avg MTTD, last result)
          additionalProperties: true
        running:
          type: object
          nullable: true
          properties:
            id: { type: string }
            startedAt: { type: string, format: date-time }
        runs:
          type: array
          items:
            type: object
            required: [id, status, startedAt]
            properties:
              id: { type: string }
              trigger: { type: string }
              mode: { type: string }
              status: { type: string }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: string, format: date-time, nullable: true }
              mttdSec: { type: number, nullable: true }
              mttrSec: { type: number, nullable: true }
              gateSec: { type: integer, nullable: true }
              gatePassed: { type: boolean, nullable: true }
              error: { type: string, nullable: true }
        chaosExperiments:
          type: array
          items: { $ref: '#/components/schemas/ChaosExperiment' }
        chaosHooks:
          type: object
          description: presence-only inventory — hook URLs are never echoed
          required: [servicesWithHook, servicesTotal]
          properties:
            servicesWithHook: { type: integer }
            servicesTotal: { type: integer }

    # ── integrations ───────────────────────────────────────────────────
    PrometheusPut:
      type: object
      description: Auth material is persisted to IntegrationSetting and never echoed back unmasked.
      required: [baseUrl]
      properties:
        baseUrl: { type: string, pattern: '^https?://', maxLength: 300 }
        auth:
          type: object
          properties:
            kind: { type: string, enum: [none, basic, bearer] }
            username: { type: string }
            password: { type: string }
            token: { type: string }
    PrometheusStatus:
      type: object
      required: [configured, baseUrl, auth]
      properties:
        configured: { type: boolean }
        baseUrl: { type: string, nullable: true }
        auth:
          type: object
          description: masked — kinds/presence only
          properties:
            kind: { type: string }
    NotifyStatus:
      type: object
      required: [transport, mode, telegramBotTokenSet, baleBotTokenSet]
      properties:
        transport: { type: string }
        mode: { type: string, enum: [demo, live] }
        telegramBotTokenSet: { type: boolean, description: presence only — values never echoed }
        baleBotTokenSet: { type: boolean }
    DigestStatus:
      type: object
      required: [frequency, hour]
      properties:
        frequency: { type: string, enum: [off, daily, weekly] }
        hour: { type: integer }
        dayOfWeek: { type: integer, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }

    # ── users / audit ──────────────────────────────────────────────────
    User:
      type: object
      description: Passwords are never returned; no secret fields here.
      required: [id, name, email, role, locale, disabled, createdAt, memberships]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        locale: { type: string, enum: [en, fa] }
        disabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        memberships:
          type: array
          items:
            type: object
            required: [tenantId, role]
            properties:
              tenantId: { type: string }
              role: { type: string, enum: [tenant-admin, engineer, executive, viewer] }
    CreateUser:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 120 }
        password: { type: string, minLength: 1, maxLength: 200, description: 'policy — ≥12 chars, no repeated-char runs, no trivial words' }
        role: { $ref: '#/components/schemas/Role' }
        locale: { type: string, enum: [en, fa] }
        memberships:
          type: array
          maxItems: 50
          items:
            type: object
            required: [tenantId]
            properties:
              tenantId: { type: string, minLength: 1, maxLength: 64 }
              role: { type: string, enum: [tenant-admin, engineer, executive, viewer] }
    PatchUser:
      type: object
      description: At least one field required; last-enabled-owner guards enforced server-side.
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        role: { $ref: '#/components/schemas/Role' }
        locale: { type: string, enum: [en, fa] }
        password: { type: string, minLength: 1, maxLength: 200 }
        disabled: { type: boolean }
    AuditEntry:
      type: object
      required: [id, ts, actorType, action]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actorType: { type: string, enum: [user, system, token] }
        actorId: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        action: { type: string }
        detail: { type: string, nullable: true }
        ip: { type: string, nullable: true }







